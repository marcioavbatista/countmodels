name: Build and publish R packages to drat

on:
  push:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 1️⃣ Clona o repositório do pacote (countmodels)
      - uses: actions/checkout@v4

      # 2️⃣ Clona o repositório drat (marcio-lib) dentro do workspace
      - name: Checkout drat repo
        uses: actions/checkout@v4
        with:
          repository: marcioavbatista/marcio-lib
          path: marcio-lib          # 👈 dentro do workspace
          token: ${{ secrets.PERSONAL_TOKEN }}

      # 3️⃣ Instala R
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      # 4️⃣ Instala dependências
      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("devtools","drat","rcmdcheck"))'

      # 5️⃣ Cria o pacote source
      - name: Build package source
        run: R CMD build .

      # 6️⃣ Insere pacote no repositório drat
      - name: Insert package to drat
        run: |
          cd marcio-lib
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          Rscript -e 'library(drat);
            pkg <- list.files("../", pattern="\\.tar\\.gz$", full.names=TRUE)
            insertPackage(pkg,
                          repodir=".",
                          commit=TRUE, push=TRUE)'

name: Build and publish R packages to drat

on:
  push:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      # 1️⃣ Clona o repositório do pacote (countmodels)
      - uses: actions/checkout@v4

      # 2️⃣ Clona o repositório drat (marcio-lib) dentro do workspace
      - name: Checkout drat repo
        uses: actions/checkout@v4
        with:
          repository: marcioavbatista/marcio-lib
          path: ./marcio-lib          # 👈 dentro do workspace
          token: ${{ secrets.PERSONAL_TOKEN }}

      # 3️⃣ Instala R
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
    
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y librcppparallel-dev  # Ou o nome exato do pacote

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install r-rcppparallel  # Ou o nome exato no Homebrew

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install rcppparallel  # Ou o nome exato no Chocolatey
      
      # 4️⃣ Instala dependências
      - name: Install R dependencies
        run: |
          Rscript -e '

          cran_deps <- c("RcppParallel", "rstan", "rstantools", "BH", "RcppEigen", "StanHeaders", "devtools", "drat", "rcmdcheck")
          
          # Instala TODOS do CRAN
          for (pkg in cran_deps) {
            if (!require(pkg, character.only = TRUE, quietly = TRUE)) {
              install.packages(pkg)
              # Força instalação se ainda não estiver disponível
              if (!require(pkg, character.only = TRUE, quietly = TRUE)) {
                stop("Failed to install: ", pkg)
              }
            }
          }
          '

      # 5️⃣ Cria o pacote source
      - name: Build package source
        run: |
          Rscript -e 'devtools::build()'
          Rscript -e 'devtools::build(binary = T)'

      # 6️⃣ Insere pacote no drat (Linux/macOS → bash)
      - name: Insert package to drat (Unix)
        if: runner.os != 'Windows'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          cat > insert_to_drat.R <<'RSCRIPT'
          library(drat)
          original_dir <- getwd()
          setwd("..")
          files <- list.files(full.names = TRUE)
          pkg <- files[endsWith(files, c(".tar.gz", ".tgz"))]
          if (length(pkg) == 0) stop("No tar.gz found")
          insertPackage(file = pkg, repodir = file.path(original_dir,"marcio-lib"),
          commit = T)
          RSCRIPT
          Rscript insert_to_drat.R
      
      # 7️⃣ Insere pacote no drat (Windows → PowerShell)
      - name: Insert package to drat (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.email 'actions@github.com'
          git config --global user.name 'GitHub Actions'
          $r = @'
          library(drat)
          original_dir <- getwd()
          setwd("..")
          files <- list.files(full.names = TRUE)
          cat(files)
          pkg <- files[endsWith(files, c(".tar.gz",".zip"))]
          cat(pkg)
          if (length(pkg) == 0) stop("No tar.gz found")
          insertPackage(file = pkg, repodir = file.path(original_dir,"marcio-lib"),
          commit = T)
          '@
          $r | Out-File -Encoding UTF8 insert_to_drat.R
          Rscript insert_to_drat.R

